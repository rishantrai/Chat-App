services:
  # 1. The Backend Server
  - type: web
    name: chat-app-backend
    env: node
    rootDir: Server
    buildCommand: npm install
    startCommand: node server.js
    plan: free

  # 2. The Frontend Client
  - type: web
    name: chat-app-frontend
    runtime: static
    rootDir: Client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
